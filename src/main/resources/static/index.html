<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inkwell</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Inkwell</h1>
<form  id = "post-form">
    <div>
        <label for="title">Title</label>
        <input id="title" type="text">
        <div id="title-error" style="color:red"></div>
    </div>
    <div>
        <label for="content">Content</label>
        <textarea id="content" rows="5" cols="40"></textarea>
        <div id="content-error" style="color:red"></div>
    </div>
    <button type="submit" id="submit-button">Publish</button>
    <button type="button" id="cancel-button" hidden>Cancel</button>
</form>
<div id="posts"></div>
<script src="app.js"></script>
</body>
</html>
